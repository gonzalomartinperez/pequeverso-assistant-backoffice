name: Branch policy
# Validates the route of every pull request into develop or main
# (CONTRIBUTING.md#branch-flow-and-protection): type/kebab-case task branches, Dependabot and the
# main back-merge into develop; develop, or an owner-approved hotfix/*, into main.
# pull_request_target runs this workflow and its script from the BASE branch, so a pull request
# cannot weaken the rule; the PR head is never checked out or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
    branches: [main, develop]
permissions: {}
concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-policy
            .nvmrc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Validate the pull request route (base-branch code, API metadata only)
        run: node scripts/branch-policy/run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
